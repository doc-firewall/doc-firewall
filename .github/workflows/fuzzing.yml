name: Fuzzing
on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'  # Run daily at 2:30 AM
permissions: read-all
jobs:
  atheris:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.1.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install --require-hashes -r tests/fuzz-requirements.txt
      - name: Run Fuzzer
        # Run for a limited time (e.g., 60 seconds) in CI to check for crashes
        # PYTHONPATH=src avoids 'pip install .' which cannot be hash-pinned
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python3 tests/fuzz_target.py -atheris_runs=10000
