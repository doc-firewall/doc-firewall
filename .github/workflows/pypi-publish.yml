name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # IMPORTANT: This permission is required for trusted publishing
      attestations: write
    environment:
      name: pypi
      url: https://pypi.org/p/doc-firewall
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.10"
        
    - name: Install build dependencies
      run: python -m pip install --require-hashes -r scripts/requirements-build.txt
      
    - name: Build distribution
      run: python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1

    - name: Generate artifact attestation
      id: provenance
      uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
      with:
        subject-path: 'dist/*'

    - name: Rename attestation bundle for Scorecard
      run: cp "${{ steps.provenance.outputs.bundle-path }}" attestation.intoto.jsonl

    - name: Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
      with:
        inputs: >-
          ./dist/*.tar.gz
          ./dist/*.whl

    - name: Upload artifact signatures to GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        gh release upload
        '${{ github.ref_name }}' dist/** attestation.intoto.jsonl
        --repo '${{ github.repository }}'
        --clobber
