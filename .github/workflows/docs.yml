name: Publish Docs
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5.1.0
        with:
          python-version: 3.x
      - run: python3 -m pip install --require-hashes -r scripts/requirements-docs.txt
      - run: mkdocs gh-deploy --force