name: Trivy Security Scan

on:
  push:
    branches: [ "main" ]
    paths:
      - "Dockerfile"
      - "requirements*.txt"
      - "pyproject.toml"
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 6 * * 3'  # Every Wednesday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # Needed to upload SARIF results to GitHub Security tab

jobs:
  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy on filesystem (repo dependencies + secrets)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe8 # v0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail — report only, GitHub issues via SARIF upload

      - name: Upload Trivy filesystem results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-filesystem'

  trivy-docker:
    name: Trivy Docker image scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Docker image for scanning
        run: docker build -t doc-firewall:scan-target .

      - name: Run Trivy on Docker image
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe8 # v0.28.0
        with:
          scan-type: 'image'
          image-ref: 'doc-firewall:scan-target'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy image results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: 'trivy-docker'
