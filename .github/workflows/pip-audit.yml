name: pip-audit

on:
  push:
    branches: [ "main" ]
    paths:
      - "pyproject.toml"
      - "requirements*.txt"
  pull_request:
    branches: [ "main" ]
    paths:
      - "pyproject.toml"
      - "requirements*.txt"
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write  # Allows the workflow to open issues for found vulnerabilities

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.1.0
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install --require-hashes -r scripts/requirements-pip-audit.txt

      - name: Run pip-audit on pinned dependencies
        id: audit
        run: |
          # Audit the hash-pinned production requirements file (requirements-docker.txt)
          pip-audit -r requirements-docker.txt --output json --format json > audit_results.json \
            || echo '{"vulnerabilities": []}' > audit_results.json

      - name: Report vulnerabilities
        run: |
          VULNS=$(python3 -c "
          import json, sys
          try:
              data = json.load(open('audit_results.json'))
              vulns = data.get('vulnerabilities', [])
              if vulns:
                  print(f'Found {len(vulns)} vulnerability/vulnerabilities:')
                  for v in vulns:
                      print(f'  - {v[\"name\"]} {v[\"version\"]}: {v[\"vulns\"]}')
                  sys.exit(1)
              else:
                  print('No vulnerabilities found.')
          except Exception as e:
              print(f'Could not parse results: {e}')
          ")
          echo "$VULNS"

      - name: Upload audit results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.1.3
        if: always()
        with:
          name: pip-audit-results
          path: audit_results.json
