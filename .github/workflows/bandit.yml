name: Bandit SAST

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
  pull_request:
    branches: [ "main" ]
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
  schedule:
    - cron: '0 7 * * 2'  # Every Tuesday at 07:00 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  bandit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Upload SARIF to GitHub Security tab
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5.1.0
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install --require-hashes -r scripts/requirements-bandit.txt

      - name: Run Bandit
        # Scan src/ and tests/ — skip B101 (assert in tests is expected)
        run: |
          bandit -r src/ tests/ \
            --skip B101 \
            --severity-level medium \
            --confidence-level medium \
            --format sarif \
            --output bandit-results.sarif || true

      - name: Upload Bandit results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4
        if: always()
        with:
          sarif_file: bandit-results.sarif
          category: bandit
