name: Bandit SAST

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
  pull_request:
    branches: [ "main" ]
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
  schedule:
    - cron: '0 7 * * 2'  # Every Tuesday at 07:00 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  bandit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Upload SARIF to GitHub Security tab
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5.1.0
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install --require-hashes -r scripts/requirements-bandit.txt

      - name: Run Bandit
        # Scan src/ and tests/ — skip B101 (assert in tests is expected)
        # Exit codes: 0=no issues, 1=issues found, other=error; all are safe to continue.
        # If bandit writes nothing (e.g. empty codebase path), emit a valid empty SARIF
        # so the upload step never receives a truncated/empty file.
        run: |
          bandit -r src/ tests/ \
            --skip B101 \
            --severity-level medium \
            --confidence-level medium \
            --format sarif \
            --output bandit-results.sarif || true
          if [ ! -s bandit-results.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Bandit","rules":[]}},"results":[]}]}' > bandit-results.sarif
          fi

      - name: Upload Bandit results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4
        if: always()
        with:
          sarif_file: bandit-results.sarif
          category: bandit
