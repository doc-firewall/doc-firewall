name: Bandit SAST

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
  pull_request:
    branches: [ "main" ]
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
  schedule:
    - cron: '0 7 * * 2'  # Every Tuesday at 07:00 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  bandit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Upload SARIF to GitHub Security tab
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.1.0
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install --require-hashes -r scripts/requirements-bandit.txt

      - name: Run Bandit
        # Scan src/ and tests/ — skip B101 (assert in tests is expected)
        # Exit codes: 0=no issues, 1=issues found, other=error; all are safe to continue.
        # If bandit writes nothing (e.g. empty codebase path), emit a valid empty SARIF
        # so the upload step never receives a truncated/empty file.
        run: |
          bandit -r src/ tests/ \
            --skip B101 \
            --severity-level medium \
            --confidence-level medium \
            --format sarif \
            --output bandit-results.sarif || true
          if [ ! -s bandit-results.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Bandit","rules":[]}},"results":[]}]}' > bandit-results.sarif
          fi

      - name: Upload Bandit results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        if: always()
        with:
          sarif_file: bandit-results.sarif
          category: bandit
