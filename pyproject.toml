[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-firewall"
version = "0.5.1"
description = "LLM-aware document intake security scanning for PDF/DOCX/PPTX/XLSX"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name="G Mendes"}]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "numpy>=1.24.0",
  "python-docx>=1.1.0",
  "openpyxl>=3.1.0",
  "defusedxml>=0.7.1",
  "structlog>=24.1.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.14.2",  # GHSA-4xgf-cpjx-pc3j: <2.14.2 follows symlinks outside secrets_dir
  "filelock>=3.20.3",
]

[project.optional-dependencies]
ml = [
  "docling>=2.84.0",
  "sentence-transformers>=3.0.0",
  "pyahocorasick>=2.0.0",
  "scikit-learn>=1.2.0",
  "torch>=2.12.1",  # < 2.12.1: memory corruption via torch.jit.script (GHSA / CVE)
  "torchvision>=0.19.0",
  "pytesseract>=0.3.10"
]
bench = [
  "pandas>=2.0.0",
  "matplotlib>=3.7.0"
]
formats = [
  "striprtf>=0.0.26",
  "html5lib>=1.1"
]
crypto = [
  "pikepdf>=8.0.0"
]
api = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "python-multipart>=0.0.9",
]
# Soft dependencies the test suite imports directly (yaml for policy tests,
# pyahocorasick for 35+ advanced-matcher tests). Kept in their own extra so
# `pip install -e .[test] && pytest` is green from the documented command.
test = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "pyyaml>=6.0",
    "pyahocorasick>=2.0.0",
    "striprtf>=0.0.26",
    "html5lib>=1.1",
]
dev = [
    "build",
    "twine",
    "pytest>=8.0.0",
    "ruff",
    "hypothesis>=6.100.0",
    "pyyaml>=6.0",
    "pyahocorasick>=2.0.0",
]

[project.urls]
Homepage = "https://www.docfirewall.com/"
Documentation = "https://www.docfirewall.com/"
Repository = "https://github.com/doc-firewall/doc-firewall"
Issues = "https://github.com/doc-firewall/doc-firewall/issues"

[project.scripts]
doc-firewall = "doc_firewall.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

# W2 (0.5.0): ship the vendored injection classifier weights in the wheel.
[tool.setuptools.package-data]
doc_firewall = ["ml/*.npz"]

# Ruff config lives in ruff.toml — see that file.

[tool.pytest.ini_options]
markers = [
    "adversarial: injection and evasion adversarial test cases",
    "benign: false-positive regression tests (clean documents must be ALLOW)",
    "mutation: obfuscation and bypass mutation tests",
]

[tool.ruff.lint]
select = ["E", "F", "B"]  # Enable pycodestyle (E), Pyflakes (F), and flake8-bugbear (B)
ignore = []
