[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-firewall"
version = "0.3.4"
description = "LLM-aware document intake security scanning for PDF/DOCX/PPTX/XLSX"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name="G Mendes"}]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "numpy>=1.24.0",
  "python-docx>=1.1.0",
  "openpyxl>=3.1.0",
  "defusedxml>=0.7.1",
  "structlog>=24.1.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0.0",
  "filelock>=3.20.3",
  "pip>=26.1"
]

[project.optional-dependencies]
ml = [
  "docling>=2.84.0",
  "sentence-transformers>=3.0.0",
  "pyahocorasick>=2.0.0",
  "scikit-learn>=1.2.0",
  "torch>=2.4.0",
  "torchvision>=0.19.0"
]
bench = [
  "pandas>=2.0.0",
  "matplotlib>=3.7.0"
]
api = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.26",
  "requests>=2.32.3"
]
dev = [
    "build",
    "twine",
    "pytest",
    "ruff",
]

[project.urls]
Homepage = "https://www.docfirewall.com/"
Documentation = "https://www.docfirewall.com/"
Repository = "https://github.com/doc-firewall/doc-firewall"
Issues = "https://github.com/doc-firewall/doc-firewall/issues"

[project.scripts]
doc-firewall = "doc_firewall.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B"]  # Enable pycodestyle (E), Pyflakes (F), and flake8-bugbear (B)
ignore = []
